<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover e o que faz env(safe-area-inset-*) valer alguma coisa no notch -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Medido: e a cor do video sob o scrim do topo. Com o creme antigo a barra
     de status emendava com a faixa do header e reforcava a leitura de
     "tres faixas empilhadas" que o hero sangrando veio desfazer. -->
<meta name="theme-color" content="#484344">
<title>Intimatto Delles — Coleção Essence</title>
<meta name="description" content="Roupa feminina e moda íntima em Palmas. Coleção Essence.">
<link rel="canonical" href="https://ti4g.github.io/intimatto/">

<!-- O link desta loja circula em story e bio do Instagram e em conversa de
     WhatsApp. Sem isto ele aparece como retangulo cinza sem imagem. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Intimatto Delles">
<meta property="og:title" content="Intimatto Delles — Coleção Essence">
<meta property="og:description" content="Roupa feminina e moda íntima em Palmas. Escolha as peças e fale com a gente no WhatsApp.">
<meta property="og:url" content="https://ti4g.github.io/intimatto/">
<meta property="og:locale" content="pt_BR">
<meta property="og:image" content="https://ti4g.github.io/intimatto/img/social/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Intimatto Delles — Coleção Essence">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="img/social/favicon.png" type="image/png" sizes="any">
<link rel="apple-touch-icon" href="img/social/apple-touch-icon.png">

<!-- Preload so na display (Jost). Hanken carrega no fluxo normal. -->
<link rel="preload" href="fonts/jost-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jost-300.woff2" as="font" type="font/woff2" crossorigin>

<!-- O poster e o LCP: ele pinta antes do video ter um frame decodificado. -->
<link rel="preload" as="image" href="img/hero/essence-poster.webp" fetchpriority="high">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Sem JS nao ha catalogo: a grade e montada pelo script. Estas duas linhas
     evitam que a pagina vire hero bonito e vazio, sem explicacao. -->
<noscript>
  <p class="semjs">
    Para ver as peças, ative o JavaScript — ou fale com a gente no
    <a href="https://instagram.com/intimattodelles" target="_blank" rel="noopener">Instagram</a>
    ou no <a href="https://wa.me/5563999614831" target="_blank" rel="noopener">WhatsApp</a>.
  </p>
</noscript>

<header class="header">
  <!-- "./" e nao "/": o site vive em /intimatto/, entao a barra sozinha
       apontaria pra raiz do dominio e jogaria a cliente pra fora. -->
  <a class="marca" href="./">
    <span class="marca__nome voz-peso">Intimatto</span>
    <span class="marca__sub voz-ar">Delles</span>
  </a>
  <!-- So aparece no desktop: no celular os tres blocos nao cabem em 375px -->
  <p class="header__local voz-ar">Palmas · TO</p>
  <nav class="header__links" aria-label="Contato">
    <a class="header__link voz-ar" href="https://instagram.com/intimattodelles"
       target="_blank" rel="noopener">Instagram</a>
    <span class="header__ponto" aria-hidden="true"></span>
    <!-- So no desktop: no celular quem cumpre este papel e a prateleira fixa
         no rodape, que fica sempre a vista e nao disputa espaco no topo. -->
    <button class="header__link header__provador voz-ar" id="abrir-provador" type="button">
      Provador<span class="header__provador__conta" id="provador-conta"></span>
    </button>
  </nav>
  <div class="fio" role="presentation"><span class="fio__traco"></span></div>
</header>

<main>
  <!-- O video e da propria campanha da loja. Mudo, em loop, com poster: o iOS
       so faz autoplay de video mudo, e em Modo de Baixo Consumo ele bloqueia
       mesmo assim — nesse caso o poster e o que a cliente ve. Fica
       aria-hidden porque nao carrega informacao alem do h1 ao lado. -->
  <section class="hero" aria-labelledby="hero-titulo">
    <div class="hero__media">
      <video class="hero__video" id="hero-video"
             autoplay muted loop playsinline preload="auto"
             poster="img/hero/essence-poster.webp"
             width="720" height="1280" aria-hidden="true" tabindex="-1">
        <source src="img/hero/essence.mp4" type="video/mp4">
      </video>
    </div>
    <!-- No celular isto pousa sobre o video (mesma celula do grid, com o
         scrim por baixo). No desktop vai pra coluna ao lado, porque um video
         9:16 sangrando numa tela larga viraria uma fatia. -->
    <div class="hero__txt">
      <!-- O fio vem antes do titulo: o ouro lidera o lockup em vez de
           separar duas linhas de texto no meio. -->
      <span class="hero__risco" aria-hidden="true"></span>
      <!-- Duas vozes no mesmo lockup: "Coleção" na voz de ar, "Essence" na
           voz de peso. Ate aqui a pagina so usava a primeira, e o titulo lia
           como legenda em vez de nome de colecao. -->
      <h1 class="hero__titulo" id="hero-titulo">
        <span class="hero__titulo__rotulo voz-ar">Coleção</span>
        <span class="hero__titulo__nome voz-peso">Essence</span>
      </h1>
      <!-- PLACEHOLDER: a frase e da loja, nao minha. Trocar pela voz dela. -->
      <p class="hero__frase">A essência de cada uma.</p>
    </div>
  </section>

  <div class="fio" role="presentation"><span class="fio__traco"></span></div>

  <section class="grade-secao" aria-label="Peças">
    <span class="grade-conta voz-ar" id="grade-conta"></span>
    <ul class="grade" id="grade"></ul>
  </section>
</main>

<footer class="rodape">
  <img class="rodape__logo" src="img/logo/logo.jpg" width="1053" height="1053"
       loading="lazy" decoding="async" alt="Intimatto Delles">
  <nav class="rodape__links" aria-label="Contato">
    <a class="rodape__link" href="https://instagram.com/intimattodelles"
       target="_blank" rel="noopener">Instagram</a>
    <a class="rodape__link" id="rodape-wpp" href="#"
       target="_blank" rel="noopener">WhatsApp</a>
  </nav>
</footer>

<dialog class="modal" id="modal" aria-labelledby="modal-nome">
  <button class="modal__fechar" id="modal-fechar" type="button" aria-label="Fechar">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
      <path d="M1 1l16 16M17 1L1 17" fill="none" stroke="currentColor" stroke-width="1.25"/>
    </svg>
  </button>
  <div class="modal__corpo">
    <picture class="modal__foto-wrap" id="modal-foto-wrap"></picture>
    <div class="modal__info">
      <h2 class="modal__nome" id="modal-nome"></h2>
      <p class="modal__preco" id="modal-preco"></p>
      <div class="tamanhos">
        <span class="tamanhos__label voz-ar" id="tamanhos-label">Tamanho</span>
        <div class="tamanhos__opcoes" id="modal-tamanhos"
             role="group" aria-labelledby="tamanhos-label"></div>
      </div>
      <button class="wpp" id="modal-add" type="button">Levar ao provador</button>
      <p class="modal__aviso" id="modal-aviso" role="status"></p>
    </div>
  </div>
</dialog>

<!-- A prateleira: as pecas separadas ficam sempre a vista no rodape da tela.
     Resolve o caminho de volta — sem ela, quem escolhe uma peca no fim do
     catalogo precisa rolar ate o topo pra achar o provador. Some quando
     nao ha nada dentro. -->
<div class="prateleira" id="prateleira" hidden>
  <button class="prateleira__botao" id="abrir-prateleira" type="button">
    <span class="prateleira__fotos" id="prateleira-fotos" aria-hidden="true"></span>
    <span class="prateleira__acao voz-ar">Ver provador</span>
  </button>
</div>

<dialog class="provador" id="provador" aria-labelledby="provador-titulo">
  <div class="provador__topo">
    <h2 class="provador__titulo voz-ar" id="provador-titulo">Provador</h2>
    <button class="modal__fechar" id="provador-fechar" type="button" aria-label="Fechar">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
        <path d="M1 1l16 16M17 1L1 17" fill="none" stroke="currentColor" stroke-width="1.25"/>
      </svg>
    </button>
  </div>
  <div class="provador__corpo" id="provador-corpo"></div>
  <div class="provador__pe" id="provador-pe">
    <p class="provador__total" id="provador-total"></p>
    <a class="wpp" id="provador-wpp" href="#" target="_blank" rel="noopener">Enviar pedido no WhatsApp</a>
  </div>
</dialog>

<script src="js/produtos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
